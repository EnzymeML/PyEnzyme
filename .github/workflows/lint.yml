name: Ruff
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: chartboost/ruff-action@v1
        with:
          src: './pyenzyme'
          version: 0.16.10  # keep in sync with .pre-commit-config.yaml
      - uses: chartboost/ruff-action@v1
        with:
          src: './tests'
          version: 0.16.10
